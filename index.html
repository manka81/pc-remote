<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Удаленное управление ПК — Перенаправление</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151d2e;
      --border: #22324e;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 0.9rem; color: var(--muted); margin-bottom: 20px; line-height: 1.4; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .btn-primary { background-color: var(--primary); color: #fff; }
    .btn-secondary { background-color: rgba(255,255,255,0.06); border-color: var(--border); color: var(--text); margin-top: 10px; }
    .btn svg { width: 18px; height: 18px; }
    .status-badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="spinner" id="loader"></div>
    <div class="status-badge" id="status-badge">Поиск активного ПК...</div>
    <h2 id="title">Подключение к компьютеру</h2>
    <p id="desc">Определение актуального адреса зашифрованного туннеля...</p>

    <div id="action-container" style="display: none;">
      <a id="btn-open-direct" class="btn btn-primary" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        <span>Открыть панель ПК</span>
      </a>
      <a id="btn-open-relay" class="btn btn-secondary" target="_blank" href="https://ntfy.sh/pc-ctrl-537d8852326f">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        <span>Страница релея (ntfy)</span>
      </a>
    </div>
  </div>

  <script>
    const TOPIC = 'pc-ctrl-537d8852326f';
    let checkInterval = null;

    async function checkTunnelAndRedirect() {
      try {
        const res = await fetch(`https://ntfy.sh/${TOPIC}/raw?poll=1&since=all&t=${Date.now()}`, {
          cache: 'no-store'
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const text = await res.text();
        const lines = text.trim().split('\n');
        let targetUrl = '';

        for (let i = lines.length - 1; i >= 0; i--) {
          const l = lines[i].trim();
          if (l.startsWith('http')) {
            targetUrl = l;
            break;
          }
        }

        if (targetUrl) {
          // Verify tunnel is actually alive via /api/ping before redirecting
          try {
            const parsed = new URL(targetUrl);
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 3000);
            const pingRes = await fetch(`${parsed.origin}/api/ping?t=${Date.now()}`, {
              signal: ctrl.signal,
              cache: 'no-store'
            });
            clearTimeout(timer);
            if (!pingRes.ok) throw new Error('Tunnel offline');
          } catch (pingErr) {
            showWaitingState();
            return false;
          }

          document.getElementById('status-badge').textContent = 'ПК найден!';
          document.getElementById('status-badge').style.borderColor = 'var(--success)';
          document.getElementById('status-badge').style.color = 'var(--success)';
          document.getElementById('desc').textContent = 'Перенаправление в панель управления...';
          document.getElementById('action-container').style.display = 'block';
          document.getElementById('btn-open-direct').href = targetUrl;

          // Perform automatic instant redirect
          window.location.replace(targetUrl);
          return true;
        } else {
          showWaitingState();
        }
      } catch (err) {
        showWaitingState();
      }
      return false;
    }

    function showWaitingState() {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('status-badge').textContent = 'ПК офлайн';
      document.getElementById('status-badge').style.borderColor = 'var(--danger)';
      document.getElementById('status-badge').style.color = 'var(--danger)';
      document.getElementById('title').textContent = 'Компьютер выключен';
      document.getElementById('desc').textContent = 'ПК сейчас не в сети или туннель не запущен. Страница автоматически подключится, как только компьютер запустится.';
      document.getElementById('action-container').style.display = 'block';
      document.getElementById('btn-open-direct').style.display = 'none';
    }

    // Initial check
    checkTunnelAndRedirect().then((found) => {
      if (!found) {
        checkInterval = setInterval(checkTunnelAndRedirect, 5000);
      }
    });
  </script>
</body>
</html>
